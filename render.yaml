services:
  - type: web
    name: my-cms
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: cms-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
